<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store-2M</title>
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">

    <style type="text/tailwindcss">

        @theme {
        /* color */
        --color-black-900: #091421;
        --color-orange-900: #FF5708;
        --color-orange-600:#FFB59C;
        --color-blue-700:#00DAF3;
        --color-white-500:#D9E3F7;
        --color-redfouncy-900:#511500;
        --color-blue-900:#212A39;
        /* fonts */
        --font-JetBrains:"JetBrains Mono", monospace;
        --font-jakarta:"Plus Jakarta Sans", sans-serif;
        --font-grotesk:"Space Grotesk", sans-serif;
    }
    .button-click{
        @apply bg-black-900 text-white-500 py-[14px] px-[26.5px] border-2 border-transparent focus:bg-orange-900 focus:cursor-pointer w-[77px] ;
    }
</style>

</head>

<body class="bg-black-900">
    <header class="my-[10px] mx-[20px]">
        <div class="flex justify-between">
            <div class="flex justify-between gap-[8px] py-[16px]">
                <img src="./images/stryd-logo.svg" alt="logo">
                <h1
                    class="font-grotesk font-bold text-[22px] tracking-[-0.55px] leading-[22px] text-white-500 py-[5px]">
                    STRYDE</h1>
            </div>
            <div class="hidden md:flex md:justify-between md:gap-[8px] md:py-[20px]">
                <nav class="items-center text-center flex justify-between gap-[8px]">
                    <a class="bg-blue-900 py-[4px] px-[8px] rounded-[4px] text-orange-600 font-bold text-[16px] font-jakarta leading-[24px] "
                        href="#">FOOTWEAR</a>
                    <a class="text-orange-600 text-[12px] font-medium font-JetBrains leading-[16px] tracking-[0.96px]"
                        href="#">LABS</a>
                    <a class="text-orange-600 text-[12px] font-medium font-JetBrains leading-[16px] tracking-[0.96px]"
                        href="#">INNOVATIONS</a>
                </nav>
            </div>
            <div class="py-[10px] flex items-center gap-[4px]">

                <button id="search" class="p-[13px] flex items-center justify-center">
                    <img src="./images/Icon-search.svg" alt="Search">
                </button>

                <button id="shop" class="p-[13px] flex items-center justify-center relative">
                    <span id="span_value"
                        class="bg-orange-900 rounded-full absolute w-[15px] h-[15px] text-[10px] top-[5px] right-[5px]">0</span>
                    <img src="./images/collection-shop.svg" alt="Shop">
                </button>

                <button
                    class="hidden md:block py-[8px] px-[16px] bg-orange-900 rounded-[12px] text-[12px] font-JetBrains font-medium leading-[16px] tracking-[0.96px] text-redfouncy-900">
                    DROP ACCESS
                </button>

                <button class="p-[13px] bg-orange-600 rounded-[12px] flex items-center justify-center">
                    <img src="./images/user-icon.svg" alt="User">
                </button>
            </div>
        </div>

    </header>
    <main>
        <div id="new_items"></div>
        <!-- <div class="ml-[900px] mr-[10px] border-[1px] border-white h-[450px]" id="side_bar"></div> -->
        <section>
            <div class="bg-[#121C2A] w-fit">
                <div class="p-[16px]">
                    <div class="flex justify-between mb-[3.5px]">
                        <p class="bg-orange-900 text-redfouncy-900 font-JetBrains text-[10px] font-bold leading-[14px] tracking-[1px] text-center flex items-center justify-center py-[2px] px-[4px]"> BEST SELLER</p>
                        <span
                            class="text-[22px] font-grotesk font-bold leading-[26.4px] tracking-[-0.22px] text-white-500">$195</span>
                    </div>
                    <div class="relative">
                        <img src="./images/items-card1.svg" alt="">
                        <div class="absolute bottom-[8px] left-[8px] bg-[#091421]/80 py-[2px] px-[4px]">
                            <p class="text-[#00DAF3]">NITRO DUAL-WAVE</p>
                        </div>
                    </div>
                    <div class="mt-[3.1px] space-y-[3.1px]">
                        <h2
                            class="font-grotesk font-bold text-[22px] leading-[26.4px] tracking-[-0.22px] text-white-500 pt-[13px] pb-[3px]">
                            AETHER-X NITRO</h2>
                        <p class="max-w-[320px] text-[#E5BEB2] font-jakarta text-[14px] leading-[21.6px]">The flagship
                            marathon weapon. Nitrogen foam
                            wrapped around an active responsive carbon
                            rocker.
                        </p>

                        <div class="my-[16px] space-y-[4px]">
                            <span
                                class="text-[#E5BEB2] font-medium font-JetBrains leading-[14px] tracking-[1px] text-[10px] mb-[4px]">SELECT
                                SIZING (US MEN)</span>
                            <div class="flex justify-between gap-[4px] mb-[16px]">
                                <button class="button-click">8.0</button>

                                <button class=" button-click">9.0</button>

                                <button class="button-click">10.0</button>

                                <button class=" button-click">11.0</button>
                            </div>
                            <div>
                                <button
                                    class="flex bg-orange-900 py-[15px] w-full items-center text-center justify-center gap-[4px]">
                                    <img src="/images/icon-flash.svg" alt="icon-flash">
                                    <span
                                        class="text-[14px] font-medium font-JetBrains leading-[18px] tracking-[0.84px] text-redfouncy-900">DEPLOY
                                        SILHOUETTE</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- <button id="add">add to cart</button> -->
        </section>
    </main>
</body>
<script>
    // new input search html
    let search = document.getElementById("search");
    let new_items = document.getElementById("new_items");
    search.addEventListener("click", () => {
        if (new_items.children.length < 1) {
            let input = document.createElement("input")
            input.type = "text";
            input.placeholder = "Search...";
            input.style.border = "2px solid white";
            input.style.padding = "5px 15px";
            input.style.margin = "0px 22px";
            input.style.color = "black";
            input.style.backgroundColor = "white";
            input.style.borderRadius = "10px";
            new_items.appendChild(input);
        }
        else {
            new_items.innerHTML = "";
        }

    });
    // let shop=document.getElementById("shop");
    // let side_bar=document.getElementById("side_bar");
    let span_value = document.getElementById("span_value");
    let add = document.getElementById("add");
    let count = 0;
    add.addEventListener("click", () => {
        count += 1;
        span_value.innerHTML = count;
    })
</script>

</html>
